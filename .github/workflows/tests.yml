# Builds DMS and runs the test suite on every push and pull request.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.22" meson ninja pytest matplotlib

      - name: Debug build, one example with run-time checks and floating-point traps
        run: |
          make debug PYTHON=python
          bin/dms examples/eccentric_ring.nml > debug_run.log 2>&1 || (tail -40 debug_run.log; exit 1)
          tail -5 debug_run.log

      - name: Optimised build (program and Python extension)
        run: |
          make clean
          make OPT="-O3" PYTHON=python
          make python OPT="-O3" PYTHON=python

      - name: Test suite (including the slow example scripts)
        env:
          DMS_TEST_SLOW: "1"
        run: python -m pytest tests -v
